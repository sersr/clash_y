# Run with `dart run ffigen --config ffigen.yaml`.
name: ClashCoreBindings
description: |
  Bindings for the Go core C API.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/core_bindings_generated.dart'
headers:
  entry-points:
    - 'src/libclash.h'
  include-directives:
    - 'src/libclash.h'
ffi-native:
  asset-id: 'package:clash_core/core.dart'
comments:
  style: any
  length: full
