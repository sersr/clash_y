name: server
description: Clashy 桌面服务与 Flutter 端共用的响应信封、订阅模型与 IPC 常量。
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.14.0-200.0.dev

# 桌面服务本身由 Go 实现（packages/clash_core/core/cmd）；本包只保留两端共用的
# 数据结构和 Windows 服务安装/控制逻辑。
dependencies:
  ffi: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0

