name: clash_service
description: Clashy 桌面服务客户端（多平台服务安装/控制与 IPC API）。
version: 1.0.0
# repository: https://github.com/my_org/my_repo
publish_to: none

environment:
  sdk: ^3.14.0-200.0.dev

# Add regular dependencies here.
dependencies:
  code_assets: ^2.0.0
  dart_ipc:
    path: ../dart_ipc
  data_assets: ^0.20.0
  dio: ^5.11.1
  equatable: ^2.1.0
  file: ^7.0.1
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  json_annotation: ^4.12.0
  nop: ^0.3.0
  path: ^1.9.0
  server:
    path: ../server
  clash_service_android:
    path: ../clash_service_android


flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ClashServicePlugin

dev_dependencies:
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.6
